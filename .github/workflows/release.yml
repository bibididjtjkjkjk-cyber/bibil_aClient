name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    # secrets не можна читати безпосередньо в steps.if — виносимо на рівень job.
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify version/tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" != "v$VERSION" ]]; then
              echo "Tag $TAG does not match package.json version $VERSION" >&2
              exit 1
            fi
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check syntax and tests
        run: |
          npm run check
          npm test

      - name: Build Windows artifacts
        run: npm run dist:win

      - name: Create source archive
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/sources-${{ steps.version.outputs.version }}.zip" HEAD

      - name: Generate release metadata
        run: npm run release:meta

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bibil_aClient-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/latest.yml
            dist/latest.json
            dist/version.json
            dist/sources-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          assets=(
            dist/latest.yml
            dist/latest.json
            dist/version.json
            "dist/sources-${VERSION}.zip"
          )
          for f in dist/bibil_aClient-*.exe; do
            [[ "$f" == *Setup* ]] && continue
            assets+=("$f")
          done
          for f in dist/bibil_aClient-Setup-*.exe; do
            assets+=("$f")
          done
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes || true
          gh release create "$TAG" "${assets[@]}" \
            --title "bibil_aClient $VERSION" \
            --generate-notes

      - name: Publish Railway mirror (optional)
        if: ${{ env.RAILWAY_TOKEN != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p update-server/public
          cp dist/latest.yml dist/latest.json dist/version.json update-server/public/
          cp dist/sources-${VERSION}.zip update-server/public/
          cp dist/bibil_aClient-Setup-*.exe update-server/public/
          for f in dist/bibil_aClient-*.exe; do
            [[ "$f" == *Setup* ]] && continue
            cp "$f" update-server/public/
          done
          npm install -g @railway/cli
          # --no-gitignore: update-server/public/ навмисно в .gitignore, але його треба задеплоїти.
          railway up --service bibil-updates --detach --no-gitignore -y update-server
